substitutions:
  pwm_frequency: "1000 Hz"

# Dedup guard: only a real open->close cycle (a published OFF followed by an ON)
# triggers the toggle script. The delayed_on filter re-publishes ON after every
# raw pin bounce that returns quickly (absorbed by delayed_off, so no OFF is
# published); without this guard each duplicate ON fires on_press and
# double-toggles the lights.
globals:
  - id: button_press_pending
    type: bool
    initial_value: 'false'

esp32:
  variant: esp32c6

external_components:
# use all components from a local folder
- source:
    type: local
    path: components
  components:
  - mcpwm

light:
  # - platform: status_led
  #   name: "status led"
  #   output: statusoutput
  - platform: esp32_rmt_led_strip
    rgb_order: rgb
    chipset: ws2812
    rmt_symbols: 128
    id: statusledlight
    pin: 8
    name: Status LED RGB
    num_leds: 1
    icon: "mdi:led-outline"

wifi:
  on_connect:
      - output.turn_off: statusoutput # This triggers a refresh
  on_disconnect:
      - output.turn_off: statusoutput # This triggers a refresh

output:
  - platform: template
    id: statusoutput
    type: binary
    write_action:
      - if:
          condition:
             lambda: return state > 0;
          then:
            - light.turn_on: 
                id: statusledlight
                red: 1.0
                green: 0.0
                blue: 0.0
                brightness: 60%
          else:
          - if:
              condition:
                wifi.connected
              then:
                - light.turn_on: 
                    id: statusledlight
                    red: 0.0
                    green: 0.0
                    blue: 1.0
                    brightness: 30%
              else:
                - light.turn_on: 
                    id: statusledlight
                    green: 1.0
                    red: 0.0
                    blue: 0.0
                    brightness: 30%
  - platform: ledc
    id: output_red
    frequency: ${pwm_frequency}
    pin: 0
  - platform: ledc
    id: output_green
    frequency: ${pwm_frequency}
    pin: 1
  - platform: ledc
    id: output_blue
    frequency: ${pwm_frequency}
    pin: 2
  - platform: ledc
    id: output_white_warm
    frequency: ${pwm_frequency}
    pin: 3
  - platform: ledc
    id: output_white_cold
    frequency: ${pwm_frequency}
    pin: 4
  - platform: ledc
    id: output2_white_warm
    frequency: ${pwm_frequency}
    pin: 14
  - platform: mcpwm
    id: output2_white_cold
    frequency: ${pwm_frequency}
    pin: 18

binary_sensor:
- platform: gpio
  name: "Input Button"
  id: my_button_id
  pin:
    number: 19
    mode: INPUT_PULLUP
    inverted: true
  filters:
  - delayed_on: 300ms
  - delayed_off: 300ms
  on_press:
    then:
    - if:
        condition:
          lambda: 'return id(button_press_pending);'
        then:
          - globals.set:
              id: button_press_pending
              value: 'false'
          - script.execute: toggle_light
  on_release:
    then:
    - globals.set:
        id: button_press_pending
        value: 'true'
