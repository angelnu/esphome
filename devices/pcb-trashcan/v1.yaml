
substitutions:
  stepper_max_speed: "1000" # In steps/s (200 steps: 1 rotation. 40 steps ca 1 cm)
  stepper_out_acceleration: "300" # In steps/s^2 - out
  # Bucket position mapping from the trashcan lidar (mm): dist when fully IN/OUT.
  trashcan_dist_in: "89"
  trashcan_dist_out: "487"
  stepper_in_acceleration: "1000" # In steps/s^2 - aggressive: bucket is already moving when we drive it in
  stepper_stop_deceleration: "400" # finite: smooth built-in deceleration; smaller = starts earlier
  stepper_calibration_speed: "200" # slow speed used while calibrating the end positions
  move_timeout_ms: "7000" # HARD SAFETY: never drive longer than this per move
  trashcan_steps_per_mm: "5.28" # (max_step-min_step)/(dist_out-dist_in) = 2100/398
  trashcan_end_margin_mm: "20" # safety backstop: cut the current this close to each limit
  stepper_stall_threshold: "5" # Lower = less sensitive (avoid false stalls); raise for reliable homing
  door_distance_throttle: 1s # Avoids sending too frequently while door is moving
  door_distance_min_delta: "10" # In mm
  door_open_distance: "500" # In mm
  door_close_distance: "200" # In mm
  trashcan_speed_min_delta: "0.15" # Min inward speed (m/s) to trigger "helping to close" (noise-proof)
  trashcan_acceleration_min_delta: "0.2" # in m/s²
  trashcan_distance_min_delta: "5" # Min delta in mm before publishing
  trashcan_distance_throttle: 1s # Avoids sending too frequently while trashcan is moving
  vl53_timing_budget: 200ms # Integration time per measurement
  vl53_inter_measurement: 210ms # Continuous-ranging cadence (must be > timing budget + 4ms)
  vl53_update_interval: 100ms # Poll faster than the frame rate (fewer missed frames)
  # The TRASHCAN lidar drives the end-of-travel stop, so it must be FAST: a long
  # integration time / inter-measurement adds lag, and the bucket moves between
  # frames (=> the motor is cut too late). Short mode tolerates a short budget.
  vl53_tc_timing_budget: "50ms"
  vl53_tc_inter_measurement: "60ms"
  vl53_tc_update_interval: 30ms
  error_theshold: 1min

esp32:
  variant: esp32
  toolchain: platformio

external_components:
# use all components from a local folder
- source: components
  components:
  - tmc22xx # official ESPHome TMC22xx base (vendored until ESPHome 2026.11)
  - tmc2209 # official ESPHome TMC2209 stepper (vendored until ESPHome 2026.11)
  - vl53l1x_pololu # community VL53L1X (Pololu port) + speed/acceleration

uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

globals:
  # Door travel limits discovered by the calibrate script (persisted).
  - id: min_step
    type: int
    restore_value: true
    initial_value: '0'
  - id: max_step
    type: int
    restore_value: true
    initial_value: '2100'
  # 0 = idle, 1 = calibrating open, 2 = calibrating close, 3 = transient (stall settle)
  - id: calib_phase
    type: int
    restore_value: false
    initial_value: '0'
  # Logical "trashcan is out" state (position from INDEX counting drifts, so do
  # not use current_position for the 'fully closed' check).
  - id: trashcan_out
    type: bool
    restore_value: false
    initial_value: 'false'
  # "commanded but not moving" monitor (mimics the original: if the bucket does
  # not move, stop trying). DIAG/StallGuard is unreliable here (heavy load).
  - id: mon_last_pos
    type: int
    restore_value: false
    initial_value: '0'
  - id: mon_last_change_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: mon_dist
    type: float
    restore_value: false
    initial_value: '0'
  - id: mon_dist_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: blocked
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: armed
    type: bool
    restore_value: false
    initial_value: 'false'
  # Calibrated end positions, in lidar mm (see the `calibrate` script). The logic
  # stops the motor this close to (dist_in + margin) / (dist_out - margin).
  - id: dist_in
    type: float
    restore_value: true
    initial_value: '${trashcan_dist_in}'
  - id: dist_out
    type: float
    restore_value: true
    initial_value: '${trashcan_dist_out}'
  # Direction of the current move (+1 = out, -1 = in), set when a move starts. Used
  # by the watchdog instead of guessing from the positions (which drift).
  - id: move_dir
    type: int
    restore_value: false
    initial_value: '0'
  # millis() when the current move started (hard safety time limit).
  - id: move_started_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # millis() before which "helping to close" is ignored (set a few seconds after an
  # OUT move, so the settle/noise does not close the bucket by itself).
  - id: close_ok_at
    type: uint32_t
    restore_value: false
    initial_value: '0'

esphome:
  on_boot:
    # Driver fine-tuning that used to live in the custom component's setup().
    - tmc2209.configure:
        id: my_stepper
        # Direction was inverted vs the old component: with the official
        # component `inverse_direction: true` made + = IN, so door-open
        # (set_target(max_step)) jammed the bucket against the closed stop.
        # The old custom component used `inverted: true` (which was + = OUT),
        # so we must NOT inverse here -> + = OUT.
        inverse_direction: false
    - tmc2209.currents:
        id: my_stepper
        standstill_mode: freewheeling
        hold_current: 0A
    - tmc2209.stallguard:
        id: my_stepper
        threshold: ${stepper_stall_threshold}
        tcool_threshold: 312 # StallGuard active above ~150 steps/s (avoid false stalls during the low-speed ramp)
    # Ignore the sensors until they have settled (~5 s), then react.
    - delay: 5s
    - globals.set:
        id: armed
        value: 'true'

stepper:
- platform: tmc2209
  id: my_stepper
  max_speed: ${stepper_max_speed}
  acceleration: ${stepper_out_acceleration}
  rsense: 0.11
  address: 0
  microsteps: 1
  run_current: 0.8A
  enn_pin: GPIO19
  index_pin: GPIO23 # position feedback from the driver's internal step generator
  diag_pin: GPIO27 # stall / driver error
  on_stall:
    # DIAG/StallGuard is spurious here (heavy load at full-step => SG_RESULT ~0),
    # so it is only logged; stopping is done by the "not moving" monitor below.
    - lambda: 'ESP_LOGV("tmc2209", "stall pos=%d tgt=%d phase=%d", id(my_stepper)->current_position, id(my_stepper)->target_position, id(calib_phase));'

script:
  - id: calibrate
    then:
      - stepper.set_acceleration:
          id: my_stepper
          acceleration: ${stepper_out_acceleration}
      - stepper.set_deceleration:
          id: my_stepper
          deceleration: ${stepper_stop_deceleration}
      - stepper.set_speed:
          id: my_stepper
          speed: ${stepper_calibration_speed}
      - globals.set:
          id: move_dir
          value: '1'
      - globals.set:
          id: calib_phase
          value: '1'
      - stepper.report_position:
          id: my_stepper
          position: 0
      - stepper.set_target:
          id: my_stepper
          target: 1000000
  - id: calibrate_close
    then:
      - delay: 500ms
      - globals.set:
          id: move_dir
          value: '-1'
      - globals.set:
          id: calib_phase
          value: '2'
      - stepper.set_target:
          id: my_stepper
          target: -1000000

  - id: close_trashcan
    # Drive the bucket IN (used by "helping to close" and the close button). The
    # interval cuts the current (lidar-based) shortly before fully closed and the
    # bucket coasts in; min_step-500 is only a safety bound.
    then:
      - globals.set:
          id: trashcan_out
          value: 'false'
      - lambda: |-
          // Recompute the bucket position from the trashcan lidar before moving:
          // the bucket can be pushed by hand (or the belt slips), so the INDEX count
          // no longer matches reality -> derive it from the distance.
          float d = id(trashcan_lidar).get_distance();
          float span = id(dist_out) - id(dist_in);
          int32_t p = id(min_step) + (int32_t) lroundf((d - id(dist_in)) * (id(max_step) - id(min_step)) / span);
          if (p < id(min_step)) p = id(min_step);
          if (p > id(max_step)) p = id(max_step);
          id(my_stepper)->report_position(p);
          ESP_LOGD("trashcan", "close: lidar pos d=%.0f -> p=%d", d, p);
      - globals.set:
          id: move_dir
          value: '-1'
      - globals.set:
          id: move_started_ms
          value: !lambda 'return millis();'
      - stepper.set_acceleration:
          id: my_stepper
          acceleration: ${stepper_in_acceleration}
      - stepper.set_deceleration:
          id: my_stepper
          deceleration: ${stepper_stop_deceleration}
      - stepper.set_target:
          id: my_stepper
          target: !lambda return id(min_step) - 500;

  - id: open_trashcan
    then:
      - if:
          condition:
            and:
            - lambda: 'return !id(trashcan_out);'
            - lambda: 'return id(armed);'
            - lambda: 'return (id(calib_phase) == 0);'
            - lambda: 'return (id(my_stepper)->current_position == id(my_stepper)->target_position);' # no move in progress
          then:
          - globals.set:
              id: trashcan_out
              value: 'true'
          - logger.log: "Door opened (debounced) and trashcan inside -> get it out!"
          - homeassistant.service:
              service: logbook.log
              data:
                name: "${devicename}_open_door"
                message: "Door opened and trashcan inside -> get it out!"
                entity_id: sensor.${friendly_name}_distance_door
                domain: logbook
          - lambda: |-
              // Recompute the bucket position from the trashcan lidar before moving.
              float d = id(trashcan_lidar).get_distance();
              float span = id(dist_out) - id(dist_in);
              int32_t p = id(min_step) + (int32_t) lroundf((d - id(dist_in)) * (id(max_step) - id(min_step)) / span);
              if (p < id(min_step)) p = id(min_step);
              if (p > id(max_step)) p = id(max_step);
              id(my_stepper)->report_position(p);
              ESP_LOGD("trashcan", "lidar pos: d=%.0f -> p=%d", d, p);
          - globals.set:
              id: move_dir
              value: '1'
          - globals.set:
              id: move_started_ms
              value: !lambda 'return millis();'
          - stepper.set_acceleration:
              id: my_stepper
              acceleration: ${stepper_out_acceleration}
          - stepper.set_deceleration:
              id: my_stepper
              deceleration: ${stepper_stop_deceleration}
          - stepper.set_target:
              id: my_stepper
              target: !lambda return id(max_step) + 500;

i2c:
- id: bus_door
  sda: GPIO21
  scl: GPIO22
  frequency: 10kHz
- id: bus_trashcan
  sda: GPIO32
  scl: GPIO33

vl53l1x_pololu:
- id: door_lidar
  i2c_id: bus_door
  enable_pin: GPIO25 # XSHUT
  address: 0x29
  distance_mode: short
  timing_budget: ${vl53_timing_budget}
  inter_measurement: ${vl53_inter_measurement}
  update_interval: ${vl53_update_interval}
- id: trashcan_lidar
  i2c_id: bus_trashcan
  enable_pin: GPIO26 # XSHUT
  address: 0x29
  distance_mode: short
  timing_budget: ${vl53_tc_timing_budget}
  inter_measurement: ${vl53_tc_inter_measurement}
  update_interval: ${vl53_tc_update_interval}

sensor:
- platform: vl53l1x_pololu
  vl53l1x_pololu_id: door_lidar
  distance:
    name: door distance
    id: door_distance
    filters:
    - throttle: ${door_distance_throttle}
    - delta: ${door_distance_min_delta}
  range_status:
    name: door range status
    id: door_range_status
    filters:
    - delta: 1
    - throttle: ${error_theshold}

- platform: template
  name: filtered door distance
  id: filtered_filtered_distance
  lambda: return id(door_distance).get_raw_state();
  update_interval: 210ms
  filters:
  - lambda: if (x >= ${door_open_distance}) return ${door_open_distance}; if (x >= ${door_close_distance}) return ${door_close_distance}; else return 0;
  - filter_out: ${door_close_distance}
  - delta: 1

- platform: vl53l1x_pololu
  vl53l1x_pololu_id: trashcan_lidar
  distance:
    name: "trashcan distance"
    id: trashcan_distance
    filters:
    - throttle: ${trashcan_distance_throttle}
    - delta: ${trashcan_distance_min_delta}
  range_status:
    name: trashcan range status
    id: trashcan_range_status
    filters:
    - delta: 1
    - throttle: ${error_theshold}
  speed:
    name: trashcan speed
    id: speed_trashcan
    filters:
    - delta: ${trashcan_speed_min_delta}
    on_raw_value:
      then:
      - if:
          condition:
            and:
            - lambda: 'return (x <= -${trashcan_speed_min_delta});'
            - lambda: 'return (id(my_stepper)->current_position == id(my_stepper)->target_position);' #Stopped
            - lambda: 'return id(armed);'
            - lambda: 'return (id(trashcan_lidar).get_distance() > id(dist_in) + 100);' # bucket must be out
            - lambda: 'return (millis() > id(close_ok_at));' # and the bucket must have settled after coming out
            - lambda: 'return (id(calib_phase) == 0);'
          then:
          - globals.set:
              id: trashcan_out
              value: 'false'
          - logger.log: "Helping to close (speed)"
          - homeassistant.service:
              service: logbook.log
              data:
                name: "${devicename}_helping_close"
                entity_id: sensor.${friendly_name}_speed_trashcan
                domain: logbook
              data_template:
                message: Helping to close. Speed is {{ my_speed }}.
              variables:
                my_speed: !lambda return x;
          - script.execute: close_trashcan
  acceleration:
    name: trashcan acceleration
    id: trashcan_acceleration
    filters:
    - delta: ${trashcan_acceleration_min_delta}

binary_sensor:
  # "Door is open": the door lidar is NOT giving a valid short (closed) reading.
  # The VL53L1X glitches to small values (0/50/250 mm) with an INVALID range status
  # while the door is open; those glitches must NOT be read as "closed" (they used
  # to toggle this sensor OFF->ON and re-trigger the bucket). So "closed" requires a
  # VALID reading (status 0) at/below door_close_distance; anything else is "open".
  # 500 ms on/off delays reject single bad frames.
  - platform: template
    name: "${friendly_name} door open"
    id: door_open_bs
    device_class: door
    lambda: |-
      bool valid_closed = (id(door_lidar).get_range_status() == 0) &&
                          (id(door_lidar).get_distance() <= ${door_close_distance});
      return !valid_closed;
    filters:
    - delayed_on: 500ms
    - delayed_off: 500ms
    on_press:
      - script.execute: open_trashcan

interval:
  # Movement watchdog. While a move is commanded (pos != tgt) stop the motor when
  # nothing actually moves:
  #  - the INDEX position has not advanced for >500 ms (step generator halted), or
  #  - the RAW trashcan lidar distance has not changed by >=2 mm for >1200 ms
  #    (bucket stuck: belt slipping, or it already reached a mechanical stop).
  # It uses the FRESH lidar value (not the throttled sensor) and a short window so
  # a jam is caught within ~0.7 s and the belt is not ground against the stop.
  # When a move finishes the driver is disabled (current cut) so the bucket is
  # released to coast / be pushed. Baselines reset while idle.
  - interval: 100ms
    then:
      - lambda: |-
          int pos = id(my_stepper)->current_position;
          int tgt = id(my_stepper)->target_position;
          float dist = id(trashcan_lidar).get_distance();
          if (pos == tgt) {
            // Move finished: CUT THE CURRENT (disable the driver) so the bucket is
            // released - it coasts to the end stop and can be pushed by hand.
            if (id(my_stepper)->is_enabled()) id(my_stepper)->set_enabled(false);
            id(mon_last_pos) = pos;
            id(mon_last_change_ms) = millis();
            id(mon_dist) = dist;
            id(mon_dist_ms) = millis();
            id(blocked) = false;
          } else if (dist < 1.0f) {
            // No lidar data yet: keep the baselines fresh, do not flag.
            id(mon_last_pos) = pos;
            id(mon_last_change_ms) = millis();
            id(mon_dist) = dist;
            id(mon_dist_ms) = millis();
            id(blocked) = false;
          } else {
            int dir = id(move_dir);
            if (dir == 0) dir = (tgt > pos) ? 1 : -1;
            bool calibrating = (id(calib_phase) != 0);
            float to_go = (dir > 0) ? (float)(id(dist_out) - dist)
                                    : (float)(dist - id(dist_in));
            // HARD SAFETY GUARDS (never drive out with the door closed; never drive
            // longer than move_timeout_ms). These cut the current immediately.
            bool timed_out = (millis() - id(move_started_ms) > ${move_timeout_ms});
            // Only a VALID short reading means the door is really closed; a glitch
            // to a small value with a bad range status must not abort an OUT move.
            bool door_closed = (id(door_lidar).get_range_status() == 0) &&
                               (id(door_lidar).get_distance() < ${door_close_distance});
            if (timed_out || (dir > 0 && door_closed)) {
              ESP_LOGW("trashcan", "SAFETY STOP (timeout=%d door_closed=%d dir=%d) -> cut current",
                       timed_out, door_closed, dir);
              id(my_stepper)->set_enabled(false);
              id(blocked) = false;
            } else if (!calibrating && to_go <= ${trashcan_end_margin_mm}) {
              // Reached the cut point (lidar-based, robust to belt slip): stop and
              // cut the current; the bucket coasts the last few cm on its own.
              ESP_LOGD("trashcan", "lidar end reached d=%.0f dir=%d -> cut current", dist, dir);
              id(my_stepper)->set_enabled(false);
              id(blocked) = false;
              if (dir > 0) id(close_ok_at) = millis() + 1000;  // short settle before auto-close
            } else {
              if (!calibrating) {
                // Aim the motor at the limit, computed from the LIDAR, and re-aim
                // it every poll. The stepper's built-in deceleration then brings it
                // SMOOTHLY to a stop exactly when the bucket reaches the limit - no
                // jerks, independent of belt slip (the step count may drift, but the
                // target is always "the physical distance still to go").
                int32_t rem = (int32_t)(to_go * ${trashcan_steps_per_mm});
                if (rem < 1) rem = 1;
                id(my_stepper)->set_target(pos + dir * rem);
              }
              if (pos != id(mon_last_pos)) { id(mon_last_pos) = pos; id(mon_last_change_ms) = millis(); }
              float d = dist - id(mon_dist);
              if (d < 0.0f) d = -d;
              if (d >= 2.0f) { id(mon_dist) = dist; id(mon_dist_ms) = millis(); }
              id(blocked) = ((millis() - id(mon_last_change_ms) > 500) ||
                             (millis() - id(mon_dist_ms) > 1200));
            }
          }
          ESP_LOGV("mon", "pos=%d tgt=%d dist=%.1f en=%d blocked=%d", pos, tgt, dist, id(my_stepper)->is_enabled(), id(blocked));
      - if:
          condition:
            lambda: 'return id(blocked);'
          then:
          - logger.log: "Nothing moving -> stop"
          - stepper.set_target:
              id: my_stepper
              target: !lambda 'return id(my_stepper)->current_position;'
          - if:
              condition:
                lambda: 'return id(calib_phase) == 1;'
              then:
              - globals.set:
                  id: max_step
                  value: !lambda 'return id(my_stepper)->current_position;'
              - globals.set:
                  id: dist_out
                  value: !lambda 'return id(trashcan_lidar).get_distance();'
              - logger.log: "CAL: recorded dist_out"
              - globals.set:
                  id: calib_phase
                  value: '3'
              - script.execute: calibrate_close
          - if:
              condition:
                lambda: 'return id(calib_phase) == 2;'
              then:
              - globals.set:
                  id: min_step
                  value: !lambda 'return id(my_stepper)->current_position;'
              - globals.set:
                  id: dist_in
                  value: !lambda 'return id(trashcan_lidar).get_distance();'
              - logger.log: "CAL: recorded dist_in"
              - stepper.set_speed:
                  id: my_stepper
                  speed: ${stepper_max_speed}
              - globals.set:
                  id: calib_phase
                  value: '0'
# Example configuration entry
button:
  - platform: template
    name: calibrate
    id: calibrate_button
    on_press:
      - script.execute: calibrate
  - platform: template
    name: close_trashcan
    id: close_trashcan_button
    on_press:
      - script.execute: close_trashcan
