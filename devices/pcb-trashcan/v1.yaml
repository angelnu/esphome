
substitutions:
  stepper_max_speed: "1000" # In steps/s (200 steps: 1 rotation. 40 steps ca 1 cm)
  stepper_out_acceleration: "300" # In steps/s^2 - out
  # Bucket position mapping from the trashcan lidar (mm): dist when fully IN/OUT.
  trashcan_dist_in: "89"
  trashcan_dist_out: "487"
  stepper_in_acceleration: "1000" # In steps/s^2 - aggressive: bucket is already moving when we drive it in
  stepper_stop_deceleration: "400" # finite: smooth built-in deceleration; smaller = starts earlier
  stepper_calibration_speed: "200" # slow speed used while calibrating the end positions
  move_timeout_ms: "7000" # HARD SAFETY: never drive longer than this per move
  trashcan_steps_per_mm: "5.28" # (max_step-min_step)/(dist_out-dist_in) = 2100/398
  trashcan_end_margin_mm: "20" # safety backstop: cut the current this close to each limit
  stepper_stall_threshold: "5" # Lower = less sensitive (avoid false stalls); raise for reliable homing
  door_distance_throttle: 1s # Avoids sending too frequently while door is moving
  door_distance_min_delta: "10" # In mm
  door_open_distance: "500" # In mm
  door_close_distance: "200" # In mm
  trashcan_speed_min_delta: "0.15" # Min inward speed (m/s) to trigger "helping to close" (noise-proof)
  trashcan_distance_min_delta: "5" # Min delta in mm before publishing
  trashcan_distance_throttle: 1s # Avoids sending too frequently while trashcan is moving
  vl53_timing_budget: 200ms # Integration time per measurement
  vl53_update_interval: 100ms # Poll faster than the frame rate (fewer missed frames)
  # The TRASHCAN lidar drives the end-of-travel stop, so it must be FAST: a long
  # integration time adds lag, and the bucket moves between measurements (=> the
  # motor is cut too late). Short mode tolerates a short budget.
  vl53_tc_timing_budget: "50ms"
  vl53_tc_update_interval: 30ms

esp32:
  variant: esp32

# No external components: the tmc2209/tmc22xx stepper and the vl53l1x lidar are
# built into ESPHome 2026.11.0 - the vendored/community copies under components/
# were deleted with this migration.

uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

globals:
  # Door travel limits discovered by the calibrate script (persisted).
  - id: min_step
    type: int
    restore_value: true
    initial_value: '0'
  - id: max_step
    type: int
    restore_value: true
    initial_value: '2100'
  # 0 = idle, 1 = calibrating open, 2 = calibrating close, 3 = transient (stall settle)
  - id: calib_phase
    type: int
    restore_value: false
    initial_value: '0'
  # Logical "trashcan is out" state (position from INDEX counting drifts, so do
  # not use current_position for the 'fully closed' check).
  - id: trashcan_out
    type: bool
    restore_value: false
    initial_value: 'false'
  # Door-cycle latch: after an OUT, the bucket is only allowed out again once the
  # door has been GENUINELY closed and then opened again. Blocks a re-trigger while
  # the door stays open (a hand/arm across the door lidar, or a lidar glitch, makes
  # door_open_bs flap OFF->ON and used to send the bucket straight back out).
  - id: door_closed_seen
    type: bool
    restore_value: false
    initial_value: 'false'
  # "commanded but not moving" monitor (mimics the original: if the bucket does
  # not move, stop trying). DIAG/StallGuard is unreliable here (heavy load).
  - id: mon_last_pos
    type: int
    restore_value: false
    initial_value: '0'
  - id: mon_last_change_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: mon_dist
    type: float
    restore_value: false
    initial_value: '0'
  - id: mon_dist_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: blocked
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: armed
    type: bool
    restore_value: false
    initial_value: 'false'
  # Calibrated end positions, in lidar mm (see the `calibrate` script). The logic
  # stops the motor this close to (dist_in + margin) / (dist_out - margin).
  - id: dist_in
    type: float
    restore_value: true
    initial_value: '${trashcan_dist_in}'
  - id: dist_out
    type: float
    restore_value: true
    initial_value: '${trashcan_dist_out}'
  # Direction of the current move (+1 = out, -1 = in), set when a move starts. Used
  # by the watchdog instead of guessing from the positions (which drift).
  - id: move_dir
    type: int
    restore_value: false
    initial_value: '0'
  # millis() when the current move started (hard safety time limit).
  - id: move_started_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # millis() before which "helping to close" is ignored (set a few seconds after an
  # OUT move, so the settle/noise does not close the bucket by itself).
  - id: close_ok_at
    type: uint32_t
    restore_value: false
    initial_value: '0'

esphome:
  on_boot:
    # Driver fine-tuning that used to live in the custom component's setup().
    - tmc2209.configure:
        id: my_stepper
        # Direction was inverted vs the old component: with the official
        # component `inverse_direction: true` made + = IN, so door-open
        # (set_target(max_step)) jammed the bucket against the closed stop.
        # The old custom component used `inverted: true` (which was + = OUT),
        # so we must NOT inverse here -> + = OUT.
        inverse_direction: false
    - tmc2209.currents:
        id: my_stepper
        standstill_mode: freewheeling
        hold_current: 0A
    - tmc2209.stallguard:
        id: my_stepper
        threshold: ${stepper_stall_threshold}
        tcool_threshold: 312 # StallGuard active above ~150 steps/s (avoid false stalls during the low-speed ramp)
    # Ignore the sensors until they have settled (~5 s), then react.
    - delay: 5s
    - globals.set:
        id: armed
        value: 'true'

stepper:
- platform: tmc2209
  id: my_stepper
  max_speed: ${stepper_max_speed}
  acceleration: ${stepper_out_acceleration}
  rsense: 0.11
  address: 0
  microsteps: 1
  run_current: 0.8A
  enn_pin: GPIO19
  index_pin: GPIO23 # position feedback from the driver's internal step generator
  diag_pin: GPIO27 # stall / driver error
  on_stall:
    # DIAG/StallGuard is spurious here (heavy load at full-step => SG_RESULT ~0),
    # so it is only logged; stopping is done by the "not moving" monitor below.
    - lambda: 'ESP_LOGV("tmc2209", "stall pos=%d tgt=%d phase=%d", id(my_stepper)->current_position, id(my_stepper)->target_position, id(calib_phase));'

script:
  - id: calibrate
    then:
      - stepper.set_acceleration:
          id: my_stepper
          acceleration: ${stepper_out_acceleration}
      - stepper.set_deceleration:
          id: my_stepper
          deceleration: ${stepper_stop_deceleration}
      - stepper.set_speed:
          id: my_stepper
          speed: ${stepper_calibration_speed}
      - globals.set:
          id: move_dir
          value: '1'
      - globals.set:
          id: calib_phase
          value: '1'
      - stepper.report_position:
          id: my_stepper
          position: 0
      - stepper.set_target:
          id: my_stepper
          target: 1000000
  - id: calibrate_close
    then:
      - delay: 500ms
      - globals.set:
          id: move_dir
          value: '-1'
      - globals.set:
          id: calib_phase
          value: '2'
      - stepper.set_target:
          id: my_stepper
          target: -1000000

  - id: close_trashcan
    # Drive the bucket IN (used by "helping to close" and the close button). The
    # interval cuts the current (lidar-based) shortly before fully closed and the
    # bucket coasts in; min_step-500 is only a safety bound.
    then:
      - globals.set:
          id: trashcan_out
          value: 'false'
      - lambda: |-
          // Recompute the bucket position from the trashcan lidar before moving:
          // the bucket can be pushed by hand (or the belt slips), so the INDEX count
          // no longer matches reality -> derive it from the distance.
          float raw = id(trashcan_lidar).get_raw_state();
          if (isnan(raw)) {
            ESP_LOGW("trashcan", "no valid lidar reading -> keep current position");
            return;
          }
          float d = raw * 1000.0f;  // the official vl53l1x reports meters
          float span = id(dist_out) - id(dist_in);
          int32_t p = id(min_step) + (int32_t) lroundf((d - id(dist_in)) * (id(max_step) - id(min_step)) / span);
          if (p < id(min_step)) p = id(min_step);
          if (p > id(max_step)) p = id(max_step);
          id(my_stepper)->report_position(p);
          ESP_LOGD("trashcan", "close: lidar pos d=%.0f -> p=%d", d, p);
      - globals.set:
          id: move_dir
          value: '-1'
      - globals.set:
          id: move_started_ms
          value: !lambda 'return millis();'
      - stepper.set_acceleration:
          id: my_stepper
          acceleration: ${stepper_in_acceleration}
      - stepper.set_deceleration:
          id: my_stepper
          deceleration: ${stepper_stop_deceleration}
      - stepper.set_target:
          id: my_stepper
          target: !lambda return id(min_step) - 500;

  - id: open_trashcan
    then:
      - if:
          condition:
            and:
            - lambda: 'return !id(trashcan_out);'
            - lambda: 'return id(armed);'
            - lambda: 'return (id(calib_phase) == 0);'
          then:
          - globals.set:
              id: trashcan_out
              value: 'true'
          - logger.log: "Door opened (debounced) and trashcan inside -> get it out!"
          - homeassistant.service:
              service: logbook.log
              data:
                name: "${devicename}_open_door"
                message: "Door opened and trashcan inside -> get it out!"
                entity_id: sensor.${friendly_name}_distance_door
                domain: logbook
          - lambda: |-
              // Recompute the bucket position from the trashcan lidar before moving.
              float raw = id(trashcan_lidar).get_raw_state();
              if (isnan(raw)) {
                ESP_LOGW("trashcan", "no valid lidar reading -> keep current position");
                return;
              }
              float d = raw * 1000.0f;  // the official vl53l1x reports meters
              float span = id(dist_out) - id(dist_in);
              int32_t p = id(min_step) + (int32_t) lroundf((d - id(dist_in)) * (id(max_step) - id(min_step)) / span);
              if (p < id(min_step)) p = id(min_step);
              if (p > id(max_step)) p = id(max_step);
              id(my_stepper)->report_position(p);
              ESP_LOGD("trashcan", "lidar pos: d=%.0f -> p=%d", d, p);
          - globals.set:
              id: move_dir
              value: '1'
          - globals.set:
              id: move_started_ms
              value: !lambda 'return millis();'
          - stepper.set_acceleration:
              id: my_stepper
              acceleration: ${stepper_out_acceleration}
          - stepper.set_deceleration:
              id: my_stepper
              deceleration: ${stepper_stop_deceleration}
          - stepper.set_target:
              id: my_stepper
              target: !lambda return id(max_step) + 500;

i2c:
- id: bus_door
  sda: GPIO21
  scl: GPIO22
  frequency: 100kHz # was 10kHz: the slow bus locked the VL53L1X (it froze ~every 30 min)
- id: bus_trashcan
  sda: GPIO32
  scl: GPIO33

sensor:
# Both lidars: the OFFICIAL vl53l1x component (ESPHome 2026.11.0). It ranges in
# single-shot mode - one measurement and one publish per update tick - and
# publishes NaN for frames with an invalid range status. There is no freeze
# watchdog any more (the pololu one power-cycled a frozen sensor over XSHUT;
# the freeze was fixed by the 100 kHz door bus clock, see the 2026-10 notes).
# It reports METERS: the `multiply: 1000` filter converts the published value
# back to mm so every threshold and the persisted calibration globals keep
# their mm values. "Frame not valid" is now `isnan(get_raw_state())`.
- platform: vl53l1x
  name: door distance
  id: door_distance
  i2c_id: bus_door
  address: 0x29
  enable_pin: GPIO25 # XSHUT
  # long: with the door OPEN the sensor sees the wall up to ~3 m. In 'short'
  # (max ~1.3 m) that wall is beyond range, so an open door is indistinguishable
  # from a sensor failure (both come back with an invalid range status). 'long'
  # (max ~3.6-4 m, and more at the 200 ms timing budget used here) reads the wall
  # as a VALID far value, so "far object" and "sensor failure" can be told apart.
  # The closed door (~50 mm) stays readable: the VL53L1X minimum is ~40 mm in
  # every distance mode, well below the closed reading.
  distance_mode: long
  timing_budget: ${vl53_timing_budget}
  update_interval: ${vl53_update_interval}
  unit_of_measurement: "mm"
  accuracy_decimals: 0
  filters:
  - multiply: 1000 # the component reports meters
  - throttle: ${door_distance_throttle}
  - delta: ${door_distance_min_delta}

# The bucket lidar's SPEED (the "helping to close when pushed" feature) is
# critical for the correct operation and must derive from the UNFILTERED
# publish stream (one sample per measurement), so the raw sensor is internal
# and the published entity plus the speed sensor are copies of it. The pololu
# component computed it per ranging frame as (d - last_d)/dt (mm/ms == m/s)
# over the real elapsed time; the lambda below replicates that math exactly
# over consecutive publishes. A NaN frame (invalid range) resets the baseline
# instead of feeding garbage into the derivative. (The acceleration sensor was
# dropped - unused and publishing on every frame.)
- platform: vl53l1x
  id: trashcan_lidar
  internal: true
  i2c_id: bus_trashcan
  address: 0x29
  enable_pin: GPIO26 # XSHUT
  distance_mode: short
  timing_budget: ${vl53_tc_timing_budget}
  update_interval: ${vl53_tc_update_interval}

- platform: copy
  name: "trashcan distance"
  id: trashcan_distance
  source_id: trashcan_lidar
  unit_of_measurement: "mm"
  accuracy_decimals: 0
  filters:
  - multiply: 1000 # the component reports meters
  - throttle: ${trashcan_distance_throttle}
  - delta: ${trashcan_distance_min_delta}

- platform: copy
  name: trashcan speed
  id: speed_trashcan
  source_id: trashcan_lidar
  unit_of_measurement: "m/s"
  accuracy_decimals: 2
  icon: mdi:speedometer
  filters:
  - lambda: |-
      static float last_dist = NAN;
      static uint32_t last_ms = 0;
      if (isnan(x)) { last_dist = NAN; return {}; }  // invalid frame: reset the baseline
      const float d = x * 1000.0f;  // the published state is meters -> mm
      if (isnan(last_dist)) { last_dist = d; last_ms = millis(); return {}; }
      const float dt_ms = (float) (millis() - last_ms);
      if (dt_ms <= 0.0f) return {};
      const float v = (d - last_dist) / dt_ms;  // mm/ms == m/s (as the pololu component did)
      last_dist = d;
      last_ms = millis();
      return v;
  - delta: ${trashcan_speed_min_delta}
  on_raw_value:
    then:
    - if:
        condition:
          and:
          - lambda: 'return (x <= -${trashcan_speed_min_delta});'
          - lambda: 'return (id(my_stepper)->current_position == id(my_stepper)->target_position);' #Stopped
          - lambda: 'return id(armed);'
          - lambda: 'return (id(trashcan_lidar).get_raw_state() * 1000.0f > id(dist_in) + 100);' # bucket must be out
          - lambda: 'return (millis() > id(close_ok_at));' # and the bucket must have settled after coming out
          - lambda: 'return (id(calib_phase) == 0);'
        then:
        - globals.set:
            id: trashcan_out
            value: 'false'
        - logger.log: "Helping to close (speed)"
        - homeassistant.service:
            service: logbook.log
            data:
              name: "${devicename}_helping_close"
              entity_id: sensor.${friendly_name}_speed_trashcan
              domain: logbook
            data_template:
              message: Helping to close. Speed is {{ my_speed }}.
            variables:
              my_speed: !lambda return x;
        - script.execute: close_trashcan


binary_sensor:
  # "Door is open": a GENUINE far reading - NOT "the door lidar is not reading a
  # valid closed distance". The lidar constantly emits frames with an INVALID range
  # status (and freezes); the old "anything that is not a valid close = open" logic
  # turned every such glitch into an "open", which drove the bucket out while the
  # door was SHUT. Here "open" requires the distance to really be far
  # (>= door_open_distance; a real open reads ~2 m) on a VALID (non-NaN) frame -
  # invalid frames come back as NaN and are ignored - plus 1 s on/off delays
  # so a single bad frame cannot fake an open. Near/invalid frames are ignored.
  - platform: template
    name: "${friendly_name} door open"
    id: door_open_bs
    device_class: door
    lambda: |-
      float raw = id(door_distance).get_raw_state();
      if (isnan(raw)) return false;  // invalid frame: not "open"
      return (raw * 1000.0f) >= ${door_open_distance};
    filters:
    - delayed_on: 1s
    - delayed_off: 1s
    on_press:
      # Consume the re-arm latch on EVERY door-open edge, then (only if the door had
      # been seen genuinely closed) drive the bucket out. Consuming here - not inside
      # open_trashcan - also clears it when the bucket is already out, so a later
      # edge while the door stays open can never re-fire.
      - if:
          condition:
            lambda: 'return id(door_closed_seen);'
          then:
          - script.execute: open_trashcan
      - globals.set:
          id: door_closed_seen
          value: 'false'

  # "Door is genuinely closed": a VALID short reading (the door itself at ~50 mm) held
  # for 2 s. This re-arms the door-open trigger above. A hand/arm across the opening,
  # or a lidar glitch, does not stay this close and VALID for 2 s - so it cannot fake
  # a "close" and let the bucket be sent out again mid-open.
  - platform: template
    name: "${friendly_name} door closed"
    id: door_closed_bs
    lambda: |-
      float raw = id(door_distance).get_raw_state();
      return !isnan(raw) && (raw * 1000.0f) < ${door_close_distance};
    filters:
    - delayed_on: 2s
    - delayed_off: 500ms
    on_press:
      - globals.set:
          id: door_closed_seen
          value: 'true'

interval:
  # Movement watchdog.. While a move is commanded (pos != tgt) stop the motor when
  # nothing actually moves:
  #  - the INDEX position has not advanced for >500 ms (step generator halted), or
  #  - the RAW trashcan lidar distance has not changed by >=2 mm for >1200 ms
  #    (bucket stuck: belt slipping, or it already reached a mechanical stop).
  # It uses the FRESH lidar value (not the throttled sensor) and a short window so
  # a jam is caught within ~0.7 s and the belt is not ground against the stop.
  # When a move finishes the driver is disabled (current cut) so the bucket is
  # released to coast / be pushed. Baselines reset while idle.
  - interval: 100ms
    then:
      - lambda: |-
          int pos = id(my_stepper)->current_position;
          int tgt = id(my_stepper)->target_position;
          float raw = id(trashcan_lidar).get_raw_state();
          // 0 = no valid lidar reading (invalid/NaN frames are "no data", exactly
          // what the community component reported before its first frame).
          float dist = isnan(raw) ? 0.0f : raw * 1000.0f;
          bool calibrating_idle = (id(calib_phase) != 0);
          if (pos == tgt) {
            // Move finished: CUT THE CURRENT (disable the driver) so the bucket is
            // released - it coasts to the end stop and can be pushed by hand.
            if (id(my_stepper)->is_enabled()) id(my_stepper)->set_enabled(false);
            // Re-sync the logical "bucket is out" state from the physical position
            // (the flag can go stale after an interrupted/partial move).
            if (!calibrating_idle && dist > 5.0f) {
              if (dist <= id(dist_in) + 30.0f) id(trashcan_out) = false;
              else if (dist >= id(dist_out) - 30.0f) id(trashcan_out) = true;
            }
            id(mon_last_pos) = pos;
            id(mon_last_change_ms) = millis();
            id(mon_dist) = dist;
            id(mon_dist_ms) = millis();
            id(blocked) = false;
          } else if (dist < 1.0f) {
            // No lidar data yet: keep the baselines fresh, do not flag.
            id(mon_last_pos) = pos;
            id(mon_last_change_ms) = millis();
            id(mon_dist) = dist;
            id(mon_dist_ms) = millis();
            id(blocked) = false;
          } else {
            int dir = id(move_dir);
            if (dir == 0) dir = (tgt > pos) ? 1 : -1;
            bool calibrating = (id(calib_phase) != 0);
            float to_go = (dir > 0) ? (float)(id(dist_out) - dist)
                                    : (float)(dist - id(dist_in));
            // HARD SAFETY GUARDS (never drive out with the door closed; never drive
            // longer than move_timeout_ms). These cut the current immediately.
            bool timed_out = (millis() - id(move_started_ms) > ${move_timeout_ms});
            // Only a VALID short reading means the door is really closed; a glitch
            // to a small value with a bad range status must not abort an OUT move.
            float draw = id(door_distance).get_raw_state();
            bool door_closed = !isnan(draw) && (draw * 1000.0f) < ${door_close_distance};
            if (timed_out || (dir > 0 && door_closed)) {
              ESP_LOGW("trashcan", "SAFETY STOP (timeout=%d door_closed=%d dir=%d) -> cut current",
                       timed_out, door_closed, dir);
              id(my_stepper)->set_enabled(false);
              id(blocked) = false;
            } else if (!calibrating && to_go <= ${trashcan_end_margin_mm}) {
              // Reached the cut point (lidar-based, robust to belt slip): stop and
              // cut the current; the bucket coasts the last few cm on its own.
              ESP_LOGD("trashcan", "lidar end reached d=%.0f dir=%d -> cut current", dist, dir);
              id(my_stepper)->set_enabled(false);
              id(blocked) = false;
              if (dir > 0) id(close_ok_at) = millis() + 1000;  // short settle before auto-close
            } else {
              if (!calibrating) {
                // Aim the motor at the limit, computed from the LIDAR, and re-aim
                // it every poll. The stepper's built-in deceleration then brings it
                // SMOOTHLY to a stop exactly when the bucket reaches the limit - no
                // jerks, independent of belt slip (the step count may drift, but the
                // target is always "the physical distance still to go").
                int32_t rem = (int32_t)(to_go * ${trashcan_steps_per_mm});
                if (rem < 1) rem = 1;
                id(my_stepper)->set_target(pos + dir * rem);
              }
              if (pos != id(mon_last_pos)) { id(mon_last_pos) = pos; id(mon_last_change_ms) = millis(); }
              float d = dist - id(mon_dist);
              if (d < 0.0f) d = -d;
              if (d >= 2.0f) { id(mon_dist) = dist; id(mon_dist_ms) = millis(); }
              id(blocked) = ((millis() - id(mon_last_change_ms) > 500) ||
                             (millis() - id(mon_dist_ms) > 1200));
            }
          }
          ESP_LOGV("mon", "pos=%d tgt=%d dist=%.1f en=%d blocked=%d", pos, tgt, dist, id(my_stepper)->is_enabled(), id(blocked));
      - if:
          condition:
            lambda: 'return id(blocked);'
          then:
          - logger.log: "Nothing moving -> stop"
          - stepper.set_target:
              id: my_stepper
              target: !lambda 'return id(my_stepper)->current_position;'
          - if:
              condition:
                lambda: 'return id(calib_phase) == 1;'
              then:
              - globals.set:
                  id: max_step
                  value: !lambda 'return id(my_stepper)->current_position;'
              - globals.set:
                  id: dist_out
                  value: !lambda |-
                    float r = id(trashcan_lidar).get_raw_state();
                    return isnan(r) ? (float) id(dist_out) : r * 1000.0f;  // keep the old value on an invalid frame
              - logger.log: "CAL: recorded dist_out"
              - globals.set:
                  id: calib_phase
                  value: '3'
              - script.execute: calibrate_close
          - if:
              condition:
                lambda: 'return id(calib_phase) == 2;'
              then:
              - globals.set:
                  id: min_step
                  value: !lambda 'return id(my_stepper)->current_position;'
              - globals.set:
                  id: dist_in
                  value: !lambda |-
                    float r = id(trashcan_lidar).get_raw_state();
                    return isnan(r) ? (float) id(dist_in) : r * 1000.0f;  // keep the old value on an invalid frame
              - logger.log: "CAL: recorded dist_in"
              - stepper.set_speed:
                  id: my_stepper
                  speed: ${stepper_max_speed}
              - globals.set:
                  id: calib_phase
                  value: '0'
button:
  - platform: template
    name: calibrate
    id: calibrate_button
    on_press:
      - script.execute: calibrate
  - platform: template
    name: close_trashcan
    id: close_trashcan_button
    on_press:
      - script.execute: close_trashcan
