esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  platformio_options:
    #board_build.partitions: "../../../custom_partitions.csv"
    board_build.flash_mode: dio
esp32:
  variant: esp32c3
ota:
  - platform: esphome
    # Allow OTA updates to rewrite the partition table (repair via full image upload)
    allow_partition_access: true
logger:
  hardware_uart: USB_SERIAL_JTAG