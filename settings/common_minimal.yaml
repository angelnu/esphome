substitutions:
  comment: ""

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  comment: ${comment}
  build_path: build/${devicename}

wifi:
  power_save_mode: none
  id: wifi_id
  ssid: !secret wifi_compat_ssid
  password: !secret wifi_compat_password

ota:
  - platform: esphome
    # OTA authenticated with the shared api key (Noise protocol). No password
    # and no plaintext fallback: every device now runs a build with this block,
    # so a plaintext password prompt is never served.
    encryption:
      key: !secret api_key

logger:
  #level: VERY_VERBOSE
  #level: INFO

web_server:
  #js_url: "https://rss.angelnu.com/scrapping/esphome.js"
  port: 80

# Enable Home Assistant API
api:
  id: api_id
  encryption:
    key: !secret api_key

time:
  - platform: sntp
    timezone: Europe/Berlin

# Restart Button
button:
  - platform: restart
    id: restart_device
    name: Restart
    entity_category: 'diagnostic'
  - platform: safe_mode
    id: safe_mode_button
    name: "Restart into Safe Mode"
    entity_category: 'diagnostic'
